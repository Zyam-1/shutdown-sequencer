name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint → Typecheck → Test → Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [16, 18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify bundle size
        run: |
          ESM_SIZE=$(gzip -c dist/index.mjs | wc -c)
          echo "ESM bundle size (gzipped): ${ESM_SIZE} bytes"
          if [ "$ESM_SIZE" -gt 2048 ]; then
            echo "::error::Bundle size ${ESM_SIZE} bytes exceeds 2KB limit"
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1
          echo "---"
          TARBALL=$(npm pack 2>&1 | tail -1)
          echo "Tarball: ${TARBALL}"
          tar tzf "${TARBALL}" | head -30
